name: Blue-Green Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_WORKSPACE: production

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.0.0"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          cd terraform/environments/production
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform/environments/production
          terraform validate

  deploy:
    name: Deploy Infrastructure
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.0.0"

      - name: Terraform Init
        run: |
          cd terraform/environments/production
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform/environments/production
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform/environments/production
          terraform apply -auto-approve tfplan

  switch-environment:
    name: Switch Environment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.0.0"

      - name: Get Current Environment
        id: current-env
        run: |
          cd terraform/environments/production
          CURRENT_ENV=$(terraform output -json | jq -r '.active_target_group.value')
          echo "current_env=$CURRENT_ENV" >> $GITHUB_OUTPUT

      - name: Switch Environment
        run: |
          cd terraform/environments/production
          NEW_ENV=$([[ "${{ steps.current-env.outputs.current_env }}" == "blue" ]] && echo "green" || echo "blue")
          terraform apply -auto-approve -var="active_target_group=$NEW_ENV"

      - name: Verify Health Check
        run: |
          ALB_DNS=$(cd terraform/environments/production && terraform output -raw alb_dns_name)
          NEW_ENV=$([[ "${{ steps.current-env.outputs.current_env }}" == "blue" ]] && echo "green" || echo "blue")
          curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/$NEW_ENV/health
          # Add retry logic and proper health check validation
