name: Cleanup Old Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to cleanup (blue or green)"
        required: true
        default: "blue"
        type: choice
        options:
          - blue
          - green

env:
  AWS_REGION: us-east-1
  TF_WORKSPACE: production

jobs:
  cleanup:
    name: Cleanup Old Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.0.0"

      - name: Get Current Environment
        id: current-env
        run: |
          cd terraform/environments/production
          CURRENT_ENV=$(terraform output -json | jq -r '.active_target_group.value')
          echo "current_env=$CURRENT_ENV" >> $GITHUB_OUTPUT

      - name: Verify Environment to Cleanup
        run: |
          if [ "${{ github.event.inputs.environment }}" == "${{ steps.current-env.outputs.current_env }}" ]; then
            echo "Cannot cleanup the active environment"
            exit 1
          fi

      - name: Cleanup Environment
        run: |
          cd terraform/environments/${{ github.event.inputs.environment }}
          terraform init
          terraform destroy -auto-approve
