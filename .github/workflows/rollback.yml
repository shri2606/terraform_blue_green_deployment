name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to rollback to (blue or green)"
        required: true
        default: "blue"
        type: choice
        options:
          - blue
          - green

env:
  AWS_REGION: us-east-1
  TF_WORKSPACE: production

jobs:
  rollback:
    name: Rollback to Previous Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.0.0"

      - name: Rollback to Previous Environment
        run: |
          cd terraform/environments/production
          terraform apply -auto-approve -var="active_target_group=${{ github.event.inputs.environment }}"

      - name: Verify Health Check
        run: |
          ALB_DNS=$(cd terraform/environments/production && terraform output -raw alb_dns_name)
          curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/${{ github.event.inputs.environment }}/health
          # Add retry logic and proper health check validation
